name: Build AutoPlay Learner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "AutoPlayLearner/**"
      - ".github/workflows/autoplay.yml"

jobs:
  build:
    name: Build ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows x64
            os: windows-latest
            target: Win64
          - name: Android armv7
            os: ubuntu-latest
            target: Android32
          - name: Android arm64
            os: ubuntu-latest
            target: Android64
    steps:
      - uses: actions/checkout@v4
      - name: Build AutoPlay Learner
        uses: geode-sdk/build-geode-mod@main
        with:
          path: ./AutoPlayLearner
          target: ${{ matrix.config.target }}
          combine: true

  package:
    name: Package AutoPlay Learner
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
        with:
          zstd: false
      - uses: actions/upload-artifact@v4
        with:
          name: AutoPlayLearner-geode
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
