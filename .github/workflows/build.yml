name: Build StyleScanner

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: Win64
            label: Windows x64
            artifact: windows-x64
          - runner: ubuntu-latest
            target: Android32
            label: Android armv7
            artifact: android-armv7
          - runner: ubuntu-latest
            target: Android64
            label: Android arm64
            artifact: android-arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Geode SDK 3.5's CMake helper compares the manifest's "geode" value
      # literally to GEODE_VERSION_FULL, so build with the exact SDK version.
      - name: Prepare manifest for Geode 3.5 CMake validation
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("mod.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          manifest["geode"] = "3.5.0"
          path.write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          PY

      - name: Check out bindings snapshot for Geode SDK 3.5
        uses: actions/checkout@v4
        with:
          repository: geode-sdk/bindings
          ref: 1cd601f0a8f0d80ee1e56a647d62852cf11f079c
          path: bindings-repo

      - name: Add legacy vector mapping header for Geode 3.5
        shell: bash
        run: |
          mkdir -p bindings-repo/bindings/include/Geode/mapping
          cat > bindings-repo/bindings/include/Geode/mapping/vector.hpp <<'EOF'
          #pragma once
          #include <vector>
          EOF

      - name: Set Geode bindings path
        shell: bash
        run: echo "GEODE_BINDINGS_REPO_PATH=$GITHUB_WORKSPACE/bindings-repo" >> "$GITHUB_ENV"

      - name: Build Geode package
        id: geode-build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: 3.5.0
          target: ${{ matrix.target }}
          path: ./
          android-ndk-version: 27.3.13750724
          configure-args: -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DGEODE_DISABLE_FMT_CONSTEVAL=ON

      # Geode 3.x supports one comparator in mod.json. It also rejects
      # mismatched major versions, so >=3.0.0 allows 3.x and refuses 4.x.
      - name: Set loader-compatible Geode constraint in package
        shell: bash
        env:
          BUILD_OUTPUT: ${{ steps.geode-build.outputs.build-output }}
        run: |
          python - <<'PY'
          import json
          import os
          import tempfile
          import zipfile
          from pathlib import Path

          output = Path(os.environ["BUILD_OUTPUT"])
          packages = sorted(output.glob("*.geode"))
          if not packages:
              raise SystemExit(f"No .geode package found in {output}")

          for package in packages:
              fd, temporary_name = tempfile.mkstemp(suffix=".geode", dir=output)
              os.close(fd)
              temporary = Path(temporary_name)
              found_manifest = False
              try:
                  with zipfile.ZipFile(package, "r") as source, zipfile.ZipFile(temporary, "w") as target:
                      target.comment = source.comment
                      for entry in source.infolist():
                          data = source.read(entry.filename)
                          if entry.filename == "mod.json":
                              manifest = json.loads(data.decode("utf-8"))
                              if manifest.get("id") != "developer.stylescanner":
                                  raise RuntimeError("Unexpected mod ID in package")
                              manifest["geode"] = ">=3.0.0"
                              data = json.dumps(manifest, indent=2).encode("utf-8")
                              found_manifest = True
                          target.writestr(entry, data)
                  if not found_manifest:
                      raise RuntimeError(f"Missing root mod.json in {package.name}")
                  temporary.replace(package)
              except Exception:
                  temporary.unlink(missing_ok=True)
                  raise
          PY

      - name: Upload .geode package
        uses: actions/upload-artifact@v4
        with:
          name: StyleScanner-${{ matrix.artifact }}
          path: ${{ steps.geode-build.outputs.build-output }}/*.geode
          if-no-files-found: error
